PLG_SYSTEM_RKJCCOUNT="System - RK JComments bridge and comment count"
PLG_SYSTEM_RKJCCOUNT_XML_DESCRIPTION="Required by the other RK add-ons: puts their scripts, styles and the captcha on the article page so the comment form works even when JComments loads it on click. Optionally fills a comment-count placeholder in article cards (see the documentation for the markup)."
PLG_SYSTEM_RKJCCOUNT_FIELD_COUNT_LABEL="Comment count in cards"
PLG_SYSTEM_RKJCCOUNT_FIELD_COUNT_DESC="Replace the placeholder &lt;span class=&quot;...&quot; data-rkjc=&quot;ARTICLE ID&quot; data-rkjc-href=&quot;URL&quot;&gt;&lt;/span&gt; printed by your template or particle with the number of published comments. Shown only where comments are enabled for the article."
PLG_SYSTEM_RKJCCOUNT_FIELD_CLASS_LABEL="Placeholder class"
PLG_SYSTEM_RKJCCOUNT_FIELD_CLASS_DESC="The class attribute of the placeholder span, exactly as your markup prints it."
PLG_SYSTEM_RKJCCOUNT_FIELD_ICON_LABEL="Icon HTML"
PLG_SYSTEM_RKJCCOUNT_FIELD_ICON_DESC="Printed before the number inside the link, for example an icon font element. Leave empty for the number only."
