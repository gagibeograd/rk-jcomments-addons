COM_RKJCOMMENTS_INFO_TEXT="These are the RK add-ons for JComments: avatars, reactions, editor's pick, badges and voice comments. Each works on its own and is switched off with the green switch without affecting comments (data stays in separate tables and returns when re-enabled). Emoji, badge levels, clip length and the like are behind Settings. Nothing here changes the JComments core, so its updates do not touch our work."
