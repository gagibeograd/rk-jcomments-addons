COM_RKJCOMMENTS_FOOT="Where things live: reactions, picks and clips in the tables jcomments_rkreactions, jcomments_rkpick and jcomments_rkvoice; avatars in images/jcomment/avatars; clips in images/jcomment/voice. The comment layout is the JComments template rk (components/com_jcomments/tpl/rk, or a copy of it in your site template under html/com_jcomments/rk); the star in the comments list is an optional administrator template override."
COM_RKJCOMMENTS_DESC_RKAVATAR="Avatar gallery: the visitor picks an avatar in a modal, the choice is remembered; without a choice a stable avatar by name."
COM_RKJCOMMENTS_DESC_RKREACTIONS="Emoji reactions (like, love, haha...), one per visitor, summary under the comment."
COM_RKJCOMMENTS_DESC_RKPICK="Editor's pick: a star in the comment list and on the site, the picked comment moves to the top."
COM_RKJCOMMENTS_DESC_RKBADGES="Badges under the avatar by number of comments (editable levels) and a staff badge for staff accounts."
COM_RKJCOMMENTS_DESC_RKVOICE="Voice comment: recorded in the browser, reviewed with the comment, player in the comment."
