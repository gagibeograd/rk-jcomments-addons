; com_rkjcomments - RK dodaci za komentare (administracija)
COM_RKJCOMMENTS="RK dodaci za komentare"
COM_RKJCOMMENTS_XML_DESCRIPTION="Strana „Dodaci“ u meniju JComments-a: naši dodaci sa prekidačima, opisom i linkom na podešavanja."
COM_RKJCOMMENTS_MENU="Dodaci"
COM_RKJCOMMENTS_TITLE="JComments: RK dodaci"
COM_RKJCOMMENTS_ALL_PLUGINS="Svi JComments dodaci"
COM_RKJCOMMENTS_BACK="Komentari"
COM_RKJCOMMENTS_INFO_TITLE="Šta je ovo?"
COM_RKJCOMMENTS_INFO_TEXT="Ovo su RK dodaci za JComments: avatari, reakcije, izbor redakcije, značke, glasovni komentar i brisanje keša (kad se komentar objavi, skine, doda, izmeni ili obriše, strana članka i kategorije se odmah osveže; inače promena čeka ručni purge). Broj komentara u karticama i zaglavlju članka daje sistemski dodatak „RK JComments most i broj komentara” (Dodaci → Sistem). Svaki radi nezavisno i gasi se klikom na zeleni prekidač, bez posledica po komentare (podaci ostaju u posebnim tabelama i vrate se kad dodatak opet uključite). Emodžiji, nivoi značaka, trajanje snimka i slično menjaju se iza dugmeta „Podešavanja“. Ništa od ovoga ne menja jezgro JComments-a, pa njegov update ne dira naš rad."
COM_RKJCOMMENTS_NONE="Nije nađen nijedan RK dodatak (grupa jcomments, element rk*)."
COM_RKJCOMMENTS_COL_PLUGIN="Dodatak"
COM_RKJCOMMENTS_COL_DESC="Šta radi"
COM_RKJCOMMENTS_SETTINGS="Podešavanja"
COM_RKJCOMMENTS_CLICK_ENABLE="Uključi"
COM_RKJCOMMENTS_CLICK_DISABLE="Isključi"
COM_RKJCOMMENTS_ENABLED="Dodatak je uključen."
COM_RKJCOMMENTS_DISABLED="Dodatak je isključen."
COM_RKJCOMMENTS_TOGGLE_FAIL="To nije naš dodatak ili ne postoji."
COM_RKJCOMMENTS_FOOT="Gde se šta nalazi: reakcije, izbor i snimci su u tabelama jcomments_rkreactions, jcomments_rkpick i jcomments_rkvoice; avatari u images/jcomment/avatars; snimci u images/jcomment/voice. Izgled komentara je JComments šablon rk (components/com_jcomments/tpl/rk, ili njegova kopija u šablonu sajta pod html/com_jcomments/rk); zvezdica u listi komentara je opcioni override admin šablona."
COM_RKJCOMMENTS_DESC_RKAVATAR="Galerija avatara: posetilac bira avatar u modalu, izbor se pamti; bez izbora dobija stalni avatar po imenu."
COM_RKJCOMMENTS_DESC_RKREACTIONS="Reakcije emodžijima (sviđa mi se, volim, smešno...), jedna po posetiocu, zbir ispod komentara."
COM_RKJCOMMENTS_DESC_RKPICK="Izbor redakcije: zvezdica u listi komentara i na sajtu, izdvojen komentar ide na vrh."
COM_RKJCOMMENTS_DESC_RKBADGES="Značke ispod avatara po broju komentara (nivoi se uređuju) i značka Redakcija za naloge redakcije."
COM_RKJCOMMENTS_DESC_RKVOICE="Glasovni komentar: snimanje u pregledaču, snimak ide na pregled uz komentar, plejer u komentaru."
COM_RKJCOMMENTS_DESC_RKPURGE="Briše Joomla i LiteSpeed keš strane članka i kategorije kad se komentar objavi, skine, doda, izmeni ili obriše; inače promena čeka ručni purge."
