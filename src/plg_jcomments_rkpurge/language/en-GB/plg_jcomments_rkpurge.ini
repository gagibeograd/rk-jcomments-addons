; plg_jcomments_rkpurge (en-GB)
PLG_JCOMMENTS_RKPURGE="JComments - RK cache purge"
PLG_JCOMMENTS_RKPURGE_XML_DESCRIPTION="When a comment is published, unpublished, added, edited or deleted, clears the Joomla cache and the LiteSpeed cache (when LSCache is enabled) of the article page and its category pages so the change shows immediately."
PLG_JCOMMENTS_RKPURGE_CATEGORIES="Category pages too"
PLG_JCOMMENTS_RKPURGE_CATEGORIES_DESC="Also purges the LiteSpeed cache of the article category and parent category pages (cards with comment counts)."
