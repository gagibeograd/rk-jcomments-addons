FILES_RKJCOMMENTS="RK add-ons for JComments - template and avatars"
FILES_RKJCOMMENTS_XML_DESCRIPTION="The JComments template rk (components/com_jcomments/tpl/rk) that displays the RK add-ons (avatars, reactions, editor's pick, badges, voice comments, emoji picker) and a gallery of 35 avatars (images/jcomment/avatars). Select the template in JComments: Options: View: Template."
